services:
  - type: web
    name: proofline
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/main.mjs
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: GLOBAL_DAILY_BUDGET
        value: 200
      - key: SESSION_BUDGET
        value: 20
